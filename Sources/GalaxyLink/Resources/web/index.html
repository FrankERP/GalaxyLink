<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>GalaxyLink</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { width: 100%; height: 100%; object-fit: contain; display: block;
            image-rendering: auto; touch-action: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px;
             color: #ddd; font: 16px -apple-system, Roboto, sans-serif;
             background: rgba(0,0,0,.75); text-align: center; padding: 24px; }
  #overlay.hidden { display: none; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: #ccc; font: 14px -apple-system, Roboto, sans-serif;
          background: rgba(20,20,20,.85); border: 1px solid #444;
          padding: 8px 16px; border-radius: 999px; pointer-events: none; }
  #hint[hidden] { display: none; }
  #stats { position: fixed; top: 8px; left: 8px; color: #0f0;
           font: 12px ui-monospace, monospace; background: rgba(0,0,0,.6);
           padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #stats[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay">
  <div id="status">Connecting…</div>
</div>
<div id="hint" hidden>Tap anywhere for fullscreen</div>
<div id="stats" hidden></div>
<script src="client.js"></script>
</body>
</html>
